name: Publish Verified Renault APK

on:
  push:
    branches: [main]
    paths:
      - "docs/release-promotions/*.json"
  workflow_dispatch:
    inputs:
      promotion_file:
        description: "Checked-in release promotion manifest"
        required: true
        type: string
        default: "docs/release-promotions/v0.5.83.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: renault-verified-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the reviewed promotion request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMOTION: ${{ inputs.promotion_file }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            promotion="$INPUT_PROMOTION"
          else
            mapfile -t changed < <(
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'docs/release-promotions/*.json'
            )
            if (( ${#changed[@]} != 1 )); then
              echo "Expected exactly one new/changed promotion request, got ${#changed[@]}" >&2
              exit 1
            fi
            promotion="${changed[0]}"
          fi
          if [[ ! "$promotion" =~ ^docs/release-promotions/v[0-9]+\.[0-9]+\.[0-9]+\.json$ ]]; then
            echo "Invalid promotion path" >&2
            exit 1
          fi
          if [[ ! -f "$promotion" ]]; then
            echo "Promotion request does not exist: $promotion" >&2
            exit 1
          fi
          echo "PROMOTION_FILE=$promotion" >> "$GITHUB_ENV"
          echo "Publishing reviewed manifest: $promotion"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish only the verified immutable signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_debug_release.py "$PROMOTION_FILE"
