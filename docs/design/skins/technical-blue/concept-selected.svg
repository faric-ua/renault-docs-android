<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      .bg{fill:#0B1118}.bar{fill:#0E1721}.surface{fill:#101822}.raised{fill:#151F2A}.selected{fill:#0D4D89}
      .line{stroke:#26384A;stroke-width:2}.accentLine{stroke:#1597FF;stroke-width:4}.outline{fill:none;stroke:#1597FF;stroke-width:2}
      .t1{font:700 32px system-ui,sans-serif;fill:#F4F7FA}.t2{font:600 26px system-ui,sans-serif;fill:#F4F7FA}
      .t3{font:500 23px system-ui,sans-serif;fill:#B1C0CF}.muted{font:500 21px system-ui,sans-serif;fill:#8397AA}
      .accent{font:700 23px system-ui,sans-serif;fill:#5FB7FF}.paperText{font:20px system-ui,sans-serif;fill:#202020}
    </style>
  </defs>

  <rect class="bg" width="1080" height="1920"/>
